[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# Palette in the style of aerchain.io: indigo / violet, navy text, pale blue-grey surfaces, orange accent.
[theme]
base = "light"
primaryColor = "#5a35cf"
backgroundColor = "#f4f7fb"
secondaryBackgroundColor = "#ebe8fb"
textColor = "#1c1a4a"
linkColor = "#5a35cf"
borderColor = "#dcd8f2"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "10px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1effc"
textColor = "#1c1a4a"
borderColor = "#dcd8f2"
